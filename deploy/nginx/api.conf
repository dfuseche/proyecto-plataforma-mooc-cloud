# Reverse proxy / balanceador simple para escalamiento horizontal local
# de la API (docker compose up --scale api=N).
#
# Por que esto, y no publicar el puerto 8081 directamente en "api":
# dos contenedores no pueden enlazar el mismo puerto del host a la vez,
# asi que con container_name/ports fijos en "api" era imposible correr
# mas de una replica (ver docs/OPERACIONES.md, seccion "Escalamiento").
# nginx si puede publicar un unico puerto de host (8081) y reenviar
# cada request al nombre de servicio "api:8080"; el resolver 127.0.0.11
# es el DNS interno de Docker, que para un servicio escalado devuelve
# la IP de una replica distinta en cada resolucion (TTL de 10s via
# "valid=10s"), repartiendo el trafico entre todas las replicas vivas
# sin necesitar conocer sus IPs de antemano.

resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    location / {
        set $upstream_api api:8080;
        proxy_pass http://$upstream_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cargas de media (subida directa es a MinIO, pero las
        # respuestas de confirmacion/consulta pasan por aqui) y
        # streaming de manifiestos/segmentos HLS pueden tardar mas
        # que el default de proxy de nginx.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
