version: '3.8'

services:
  worker:
    # La imagen la construye y publica el CD en Artifact Registry; las VMs
    # hacen `pull`. `build:` queda como respaldo local (`up --build`).
    image: ${BACKEND_IMAGE:-us-central1-docker.pkg.dev/proyecto-plataforma-mooc/mooc/backend:latest}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mooc-worker-server
    command: ["/app/worker"]
    restart: always
    env_file:
      - worker-server.env
