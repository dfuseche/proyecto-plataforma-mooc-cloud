services:
  postgres:
    image: postgres:16-alpine
    container_name: mooc-postgres
    restart: always
    environment:
      POSTGRES_DB: mooc_db
      POSTGRES_USER: mooc_user
      POSTGRES_PASSWORD: mooc_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mooc_user -d mooc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mooc-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prepara el volumen de datos para RustFS: el contenedor principal
  # corre como el usuario no-root "rustfs" (uid 10001), pero el volumen
  # "minio_data" ya existia de ejecuciones previas con la imagen de
  # MinIO (que corria distinto usuario), asi que sin este paso RustFS
  # falla con "Permission denied" al intentar escribir en /data. Este
  # servicio corre una sola vez, como root, ajusta el dueño del volumen
  # y termina; "minio" espera a que termine exitosamente antes de
  # arrancar.
  minio-init:
    image: busybox:latest
    container_name: mooc-minio-init
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - minio_data:/data

  minio:
    # MinIO dejo de publicar imagenes gratuitas en Docker Hub a fines de
    # 2025 y archivo su repo de GitHub en abril de 2026, empujando a un
    # producto con licencia (AIStor). Tanto "minio/minio:latest" (Docker
    # Hub) como el mirror "quay.io/minio/minio:latest" ya devuelven error
    # de autorizacion al intentar hacer pull. Se migro a RustFS
    # (rustfs/rustfs), un store S3-compatible en Rust que la comunidad
    # recomienda como reemplazo para desarrollo local/CI, y que acepta
    # las mismas variables MINIO_ROOT_USER/MINIO_ROOT_PASSWORD (las
    # mapea automaticamente a sus equivalentes RUSTFS_*).
    #
    # El truco anterior de "mkdir -p" para que MinIO creara los buckets
    # a partir de subdirectorios ya no aplica (RustFS no lo soporta): en
    # su lugar, el backend ahora crea los buckets el mismo al arrancar
    # via la API estandar de S3 (ver StorageService.EnsureBuckets en
    # backend/internal/media/s3.go), que funciona igual contra RustFS,
    # MinIO o GCS.
    image: rustfs/rustfs:latest
    container_name: mooc-minio
    restart: always
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9002:9000" # API S3
      - "9003:9001" # Consola Web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: mooc-mailpit
    restart: always
    ports:
      - "1026:1025" # SMTP server
      - "8026:8025" # Web UI Mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin container_name ni "ports" con host fijo: ambos impiden
    # `docker compose up --scale api=N` (dos contenedores no pueden
    # compartir ni el mismo nombre ni el mismo puerto de host). El
    # servicio queda accesible solo dentro de la red de Compose en el
    # puerto 8080; nginx (abajo) expone un unico puerto de host y
    # reparte el trafico entre todas las replicas via DNS interno de
    # Docker. Ver docs/OPERACIONES.md, seccion "Escalamiento".
    restart: always
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://mooc_user:mooc_password@postgres:5432/mooc_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      EXTERNAL_MINIO_ENDPOINT: "http://localhost:9002"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
      MINIO_SECURE: "false"
      MAILPIT_HOST: "mailpit"
      MAILPIT_PORT: "1025"
      JWT_SECRET: "super-secret-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin container_name, por la misma razon que en "api": permite
    # `docker compose up --scale worker=N`. No publica puertos (no
    # recibe trafico entrante, solo consume la cola de Asynq en Redis).
    command: ["/app/worker"]
    restart: always
    environment:
      DATABASE_URL: "postgres://mooc_user:mooc_password@postgres:5432/mooc_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: mooc-nginx
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Servicio opcional, no se levanta en un `docker compose up` normal
  # (profiles: ["test"]): corre la suite E2E real (build tag "e2e") contra
  # el propio stack de Compose, reutilizando el target "builder" del
  # Dockerfile del backend (que ya tiene el toolchain de Go) en vez de
  # instalar Go en la máquina del desarrollador. Uso:
  #   docker compose --profile test run --rm e2e-tests
  e2e-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    command: ["go", "test", "-tags=e2e", "-v", "-count=1", "./tests/e2e/..."]
    environment:
      E2E_BASE_URL: "http://nginx"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
