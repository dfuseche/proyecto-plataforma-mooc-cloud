name: Deploy to GCP (CD)

# Se dispara automáticamente cuando el workflow "Backend CI Pipeline"
# (ci.yml) termina en la rama main, y solo si terminó con éxito — así el
# deploy nunca corre sobre un build que no pasó pruebas/lint/seguridad.
# También se puede disparar a mano desde la pestaña Actions (botón "Run
# workflow"), por ejemplo para re-desplegar sin cambios de código nuevos.
on:
  workflow_run:
    workflows: [ "Backend CI Pipeline" ]
    types: [ completed ]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build y despliegue (imagen + MIGs de API y worker)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # id-token: write es obligatorio para Workload Identity Federation
    # (permite que este job pida un token de identidad de OIDC de GitHub,
    # que GCP cambia por credenciales temporales — sin esto, el paso
    # "Authenticate to GCP" falla).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout del commit que pasó el CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Autenticar contra GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Instalar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # La imagen se construye UNA vez aquí y las VMs solo hacen pull (antes
      # cada VM compilaba el backend: 5-10 min). Se publica con el SHA del
      # commit (trazable/rollback) y como `latest` (lo que usan las plantillas
      # de instancia de los MIGs al arrancar).
      - name: Construir y publicar imagen en Artifact Registry
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REGISTRY: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
        run: |
          IMAGE="${REGISTRY}/${{ vars.GCP_PROJECT_ID }}/mooc/backend"
          gcloud auth configure-docker "${REGISTRY}" --quiet
          docker build -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" -f backend/Dockerfile .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

      # Las instancias de los MIGs bajan `:latest` de Artifact Registry al
      # arrancar (deploy/startup/startup.sh), así que para desplegar basta con
      # reemplazarlas. `--max-surge=1 --max-unavailable=0` crea la instancia
      # nueva ANTES de borrar la vieja; en la API, el health check de
      # autohealing hace que el MIG espere a que la nueva responda /health.
      # Un worker reemplazado a mitad de un job lo deja a asynq, que lo
      # reintenta (MaxRetry 3) en otro worker.
      - name: Actualizar los MIGs (API y workers)
        run: |
          for mig in "${{ vars.GCP_API_MIG || 'mooc-api-mig' }}" "${{ vars.GCP_WORKER_MIG || 'mooc-worker-mig' }}"; do
            gcloud compute instance-groups managed rolling-action replace "$mig" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --zone="${{ vars.GCP_ZONE }}" \
              --max-surge=1 --max-unavailable=0
          done
          for mig in "${{ vars.GCP_API_MIG || 'mooc-api-mig' }}" "${{ vars.GCP_WORKER_MIG || 'mooc-worker-mig' }}"; do
            gcloud compute instance-groups managed wait-until "$mig" --stable \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --zone="${{ vars.GCP_ZONE }}" \
              --timeout=900
          done

      # Verificación de punta a punta por el balanceador HTTPS (certificado
      # autofirmado, por eso -k). Se activa definiendo la variable de
      # repositorio GCP_LB_IP; sin ella se omite y basta con que el MIG de la
      # API haya quedado estable (arriba), que ya exige /health sano.
      - name: Verificar salud por el balanceador
        if: ${{ vars.GCP_LB_IP != '' }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "https://${{ vars.GCP_LB_IP }}/health" || true)
            echo "intento $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "El balanceador nunca respondió 200 en /health"
          exit 1
