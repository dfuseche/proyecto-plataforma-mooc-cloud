name: Deploy to GCP (CD)

# Se dispara automáticamente cuando el workflow "Backend CI Pipeline"
# (ci.yml) termina en la rama main, y solo si terminó con éxito — así el
# deploy nunca corre sobre un build que no pasó pruebas/lint/seguridad.
# También se puede disparar a mano desde la pestaña Actions (botón "Run
# workflow"), por ejemplo para re-desplegar sin cambios de código nuevos.
on:
  workflow_run:
    workflows: [ "Backend CI Pipeline" ]
    types: [ completed ]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy web-server y worker-server
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # id-token: write es obligatorio para Workload Identity Federation
    # (permite que este job pida un token de identidad de OIDC de GitHub,
    # que GCP cambia por credenciales temporales — sin esto, el paso
    # "Authenticate to GCP" falla).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout del commit que pasó el CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Autenticar contra GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Instalar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # La imagen se construye UNA vez aquí y las VMs solo hacen pull (antes
      # cada VM compilaba el backend: 5-10 min). Se publica con el SHA del
      # commit (trazable/rollback) y como `latest` (lo que usan las plantillas
      # de instancia de los MIGs al arrancar).
      - name: Construir y publicar imagen en Artifact Registry
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REGISTRY: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
        run: |
          IMAGE="${REGISTRY}/${{ vars.GCP_PROJECT_ID }}/mooc/backend"
          gcloud auth configure-docker "${REGISTRY}" --quiet
          docker build -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" backend
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
          echo "BACKEND_IMAGE=${IMAGE}:${SHA}" >> "$GITHUB_ENV"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"

      - name: Desplegar en web-server (API)
        run: |
          gcloud compute ssh "${{ vars.GCP_WEB_INSTANCE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --tunnel-through-iap \
            --command="cd ${{ vars.GCP_REPO_PATH }} && git fetch origin main && git reset --hard origin/main && bash deploy/scripts/gar-login.sh ${REGISTRY} && export BACKEND_IMAGE=${BACKEND_IMAGE} && docker-compose -f deploy/docker-compose.web.yml pull && docker-compose -f deploy/docker-compose.web.yml up -d"

      - name: Desplegar en worker-server (Worker Asíncrono + Redis)
        run: |
          gcloud compute ssh "${{ vars.GCP_WORKER_INSTANCE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --tunnel-through-iap \
            --command="cd ${{ vars.GCP_REPO_PATH }} && git fetch origin main && git reset --hard origin/main && bash deploy/scripts/gar-login.sh ${REGISTRY} && export BACKEND_IMAGE=${BACKEND_IMAGE} && docker-compose -f deploy/docker-compose.worker.yml pull && docker-compose -f deploy/docker-compose.worker.yml up -d"

      # Las instancias de los MIGs bajan `:latest` de Artifact Registry al
      # arrancar (deploy/startup/startup.sh), así que para desplegar basta con
      # reemplazarlas. `--max-surge=1 --max-unavailable=0` crea la instancia
      # nueva ANTES de borrar la vieja; en la API, el health check de
      # autohealing hace que el MIG espere a que la nueva responda /health.
      # Un worker reemplazado a mitad de un job lo deja a asynq, que lo
      # reintenta (MaxRetry 3) en otro worker.
      - name: Actualizar los MIGs (API y workers)
        run: |
          for mig in "${{ vars.GCP_API_MIG || 'mooc-api-mig' }}" "${{ vars.GCP_WORKER_MIG || 'mooc-worker-mig' }}"; do
            gcloud compute instance-groups managed rolling-action replace "$mig" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --zone="${{ vars.GCP_ZONE }}" \
              --max-surge=1 --max-unavailable=0
          done
          for mig in "${{ vars.GCP_API_MIG || 'mooc-api-mig' }}" "${{ vars.GCP_WORKER_MIG || 'mooc-worker-mig' }}"; do
            gcloud compute instance-groups managed wait-until "$mig" --stable \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --zone="${{ vars.GCP_ZONE }}" \
              --timeout=900
          done

      # worker-server no tiene IP pública (ver ARCHITECTURE_CLOUD.md,
      # subred privada), así que no se puede healthcheckear directo desde
      # el runner de GitHub Actions. En vez de eso, se verifica la API
      # (web-server, sí accesible vía IAP) ejecutando el curl DENTRO de la
      # VM por el mismo túnel SSH, no contra una IP pública.
      - name: Verificar salud tras el deploy
        run: |
          gcloud compute ssh "${{ vars.GCP_WEB_INSTANCE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCP_ZONE }}" \
            --tunnel-through-iap \
            --command="for i in \$(seq 1 15); do curl -sf http://localhost/health && exit 0; echo 'esperando a que la API quede healthy...'; sleep 2; done; echo 'La API nunca quedó healthy tras el deploy'; exit 1"
