name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mooc_user
          POSTGRES_PASSWORD: mooc_password
          POSTGRES_DB: mooc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'
          cache: true

      - name: Verify Dependencies
        run: |
          cd backend
          go mod verify

      - name: Run Go Build
        run: |
          cd backend
          go build ./...

      - name: Run Go Unit & Integration Tests
        env:
          DATABASE_URL: postgres://mooc_user:mooc_password@localhost:5432/mooc_db?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: |
          cd backend
          go test -v ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # Solo este job fija 1.25 (la version del go.mod y del Dockerfile):
          # con '1.27' golangci-lint v2.13 no puede leer la stdlib de Go 1.27
          # ("export data version 5 is greater than maximum supported version 4")
          # porque el binario del linter esta compilado con un Go anterior.
          go-version: '1.25'
          cache: true

      - name: Run golangci-lint
        # v6 + "version: latest" resolvio a un binario de golangci-lint
        # compilado con una version de Go mas vieja que la del go.mod
        # (go 1.25.0), y golangci-lint se niega a correr en ese caso
        # ("the Go language version used to build golangci-lint is lower
        # than the targeted Go version"). v7 + golangci-lint v2 (que SI
        # viene compilado con Go mas reciente) resuelve esto.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13
          working-directory: backend
          args: --timeout=5m

  security:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'
          cache: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # "working-directory" no es una clave valida en un step "uses:"
          # (solo aplica a steps "run:"); en su lugar, se le dice a gosec
          # que escanee ./backend/... desde la raiz del repo, que es
          # donde corre el action por defecto.
          args: '-fmt=sarif -out=gosec-results.sarif ./backend/...'

      - name: Upload gosec SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif-report
          path: gosec-results.sarif
          retention-days: 30

  e2e:
    name: E2E Tests (live Docker Compose stack)
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Las pruebas E2E (tests/e2e/critical_flows_test.go, build tag "e2e")
      # corren por HTTP real contra el stack completo levantado por
      # Docker Compose (api + worker + nginx + postgres + redis + minio),
      # nunca contra dobles en memoria — ver docker-compose.yml, servicio
      # "e2e-tests" (profiles: ["test"]).
      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null; then
              echo "API healthy"
              exit 0
            fi
            echo "Esperando a que la API esté lista... ($i/30)"
            sleep 2
          done
          echo "La API nunca quedó healthy"
          docker compose logs
          exit 1

      - name: Run E2E suite
        run: docker compose --profile test run --rm e2e-tests

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  postman:
    name: Postman Collection (newman)
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null; then
              echo "API healthy"
              exit 0
            fi
            echo "Esperando a que la API esté lista... ($i/30)"
            sleep 2
          done
          echo "La API nunca quedó healthy"
          docker compose logs
          exit 1

      - name: Install newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection against the live stack
        run: |
          newman run postman_collection.json \
            --env-var baseUrl=http://localhost:8081 \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export newman-report/junit.xml \
            --reporter-htmlextra-export newman-report/report.html \
            || echo "newman_failed=1" >> "$GITHUB_ENV"

      - name: Upload Postman run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: newman-report/
          retention-days: 30

      - name: Fail job if newman reported failures
        if: env.newman_failed == '1'
        run: exit 1

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
