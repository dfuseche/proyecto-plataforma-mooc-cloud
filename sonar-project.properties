# Análisis de calidad con SonarQube Cloud (ver docs/entrega3/deuda-tecnica.md).
# projectKey y organization se pasan desde el workflow (variables de GitHub
# SONAR_PROJECT_KEY y SONAR_ORGANIZATION) para no fijarlas en el repositorio.

sonar.projectName=Plataforma MOOC
sonar.sourceEncoding=UTF-8

# Alcance: API y workers (Go), frontend (React/TypeScript) y migraciones SQL.
sonar.sources=backend,frontend/src
sonar.tests=backend
sonar.test.inclusions=**/*_test.go,backend/tests/**

# Únicas exclusiones: dependencias y artefactos generados. No se excluye
# ningún código de aplicación.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage.out

# Cobertura de las pruebas de Go (generada por el job "test" del CI).
sonar.go.coverage.reportPaths=backend/coverage.out
